      AdaIN style 5.493e-03 / content 6.646; SW style 1.259e-02 / content 6.256. The comparison is visual only
      (style_bakeoff.png, not committed). The notebook records no verdict.
    hypothesis: If VGG features were Gaussian, all three losses should produce visually similar outputs.
    inferred: false
    config: {optimizer: LBFGS, line_search: strong_wolfe, lr: 1.0, max_iter: 250, img_size: 384, style_w_gatys: 1.0e6, style_w_adain: 1.0e2, style_w_sw: 1.0e3, sw_n_proj: 16, seed: 42}
    key_metrics: {gatys_content_loss_step240: 4.173, adain_content_loss_step240: 6.646, sw_content_loss_step240: 6.256, sw_style_loss_step240: 0.01259}
    outcome: inconclusive
    path: 02_style_bakeoff.ipynb
